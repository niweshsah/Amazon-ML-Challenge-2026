services:
  pipeline:
    build: .
    gpus: all
    shm_size: 16gb
    working_dir: /workspace/final_pipeline
    volumes:
      - .:/workspace/final_pipeline
      - ${ER_DATA_DIR:-./data}:/data:ro
      - ${ER_OUTPUT_DIR:-./outputs}:/outputs
      - ${ER_MODEL_DIR:-./models}:/models
      - ${ER_HF_CACHE:-./hf-cache}:/root/.cache/huggingface
    environment:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: /workspace/final_pipeline/src
