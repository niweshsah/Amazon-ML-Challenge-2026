[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "final-entity-resolution"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.2.4", "scipy==1.16.3", "scikit-learn==1.6.1", "PyYAML==6.0.2", "Unidecode==1.3.8", "xgboost==3.0.0", "joblib==1.4.2", "faiss-cpu==1.10.0"]

[project.optional-dependencies]
gpu = ["torch==2.6.0", "transformers==4.50.3", "peft==0.15.1", "safetensors==0.5.3", "sentencepiece==0.2.0"]
test = ["pytest==8.3.5", "pypdf==5.4.0"]

[project.scripts]
entity-resolution = "entity_resolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
