paths:
  data_dir: /workspace/ml-challenge/praj_files/datasets/preprocessed
  output_dir: /workspace/ml-challenge/praj_files/embedding_baseline

model:
  name: Qwen/Qwen3-Embedding-0.6B
  revision: null
  engine: auto
  dtype: bfloat16
  quantization: auto
  output_dim: 512
  max_length: 64
  trust_remote_code: true

text:
  representation: name_address_country
  deduplicate: true

embedding:
  shard_rows: 100000
  query_shard_rows: 10000
  initial_batch_size: 256
  min_batch_size: 8
  save_dtype: float16

retrieval:
  backend: auto
  top_k: 50
  threshold: null
  margin: null
  metric: cosine
  query_batch_size: 256
  thresholds: [0.60, 0.65, 0.70, 0.75, 0.80, 0.82, 0.84, 0.86, 0.88, 0.90, 0.92, 0.94, 0.96]

benchmark:
  sample_records: 100000
  quality_tolerance: 0.01

execution:
  resume: true
  atomic_writes: true
  log_interval_seconds: 10
  bad_speed_multiplier: 3.0
